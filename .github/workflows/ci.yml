name: WeazlCloud CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Restic for legacy-backend tests
        run: bash scripts/ci-install-restic.sh
      - name: Install native JPEG test dependencies
        run: sudo apt-get update && sudo apt-get install -y libjpeg-turbo8-dev libjpeg-turbo-progs
      - name: Native JPEG boundary and sanitizer checks
        run: bash scripts/test-native-preview.sh
      - run: make check
      - run: make build VERSION=ci-${GITHUB_SHA::12}

  browser:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install pinned Restic for legacy-backend smoke
        run: bash scripts/ci-install-restic.sh
      - run: make desk-assets
      - run: bash scripts/smoke-browser.sh

  container:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file deploy/Dockerfile --tag weazlcloud:ci-${GITHUB_SHA::12} .
      - run: WEAZLCLOUD_IMAGE=weazlcloud:ci-${GITHUB_SHA::12} make smoke-container
      - name: Install authenticated Photos browser smoke dependencies
        run: |
          python3 -m venv /tmp/weazlcloud-photos-venv
          /tmp/weazlcloud-photos-venv/bin/pip install playwright==1.63.0
          /tmp/weazlcloud-photos-venv/bin/playwright install --with-deps chromium
      - name: Photos and gallery browser smokes on both storage backends
        run: make smoke-photos PHOTOS_PYTHON=/tmp/weazlcloud-photos-venv/bin/python
