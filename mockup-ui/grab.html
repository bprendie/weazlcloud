<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111215"><title>Grab / WeazlCloud</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="icon" type="image/png" href="weazlcloud.png">
<link rel="apple-touch-icon" href="weazlcloud.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="grab.css">
</head>
<body class="grab-body">
<main class="grab-card" id="grab">
  <img src="weazlcloud.png" alt="WeazlCloud" class="login-brand">
  <p class="eyebrow purple" id="grab-kicker">WEAZLCLOUD / GRAB</p>
  <h1 id="grab-title">Loading…</h1>
  <p id="grab-meta" class="grab-meta"></p>
  <form id="grab-form" class="auth-form" hidden>
    <label>Passphrase<input name="phrase" type="password" autocomplete="off" maxlength="1024"></label>
  </form>
  <div id="grab-list" class="grab-list" hidden></div>
  <div class="hero-actions" id="grab-actions"></div>
  <p id="grab-error" role="alert"></p>
  <span class="eyebrow">NO ACCOUNT. ONE LINK. THEN GONE.</span>
</main>
<script type="module" src="grab.js"></script>
</body>
</html>
