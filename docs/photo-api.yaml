openapi: 3.0.3
info:
  title: WeazlCloud Photos and device API
  version: 1.0.0
  description: 'Local identity and owner-private encrypted Photos. Mutations require X-Weazl-Desk: 1.
    Hidden is explicit Photos presentation context, not a separate vault. Backup is one-way; a stored
    original is independent of derivative readiness. See photo-api.md and photos-local-verification-2026-09-30.md
    for behavior and release gates.'
servers:
- url: /
security:
- deviceBearer: []
- accountCookie: []
paths:
  /api/v1/photos/metadata-jobs:
    get:
      summary: Owner metadata repair status or paged private report
      operationId: getPhotoMetadataJob
      parameters:
      - in: query
        name: report
        schema:
          type: string
          enum:
          - '1'
      - in: query
        name: cursor
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Job status or up to 100 private asset outcomes
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/PhotoMetadataJob'
                - $ref: '#/components/schemas/PhotoMetadataReport'
        '401':
          $ref: '#/components/responses/Error401'
    post:
      summary: Start, inspect, pause, resume or retry owner capture-date repair
      operationId: setPhotoMetadataJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              properties:
                action:
                  type: string
                  enum:
                  - start
                  - dry-run
                  - pause
                  - resume
                  - retry
                root:
                  type: string
                  default: Photos
                  maxLength: 1024
                dry_run:
                  type: boolean
                sidecars_only:
                  type: boolean
      responses:
        '200':
          description: Durable background job status; no browser lifetime dependency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoMetadataJob'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/photos/seek:
    get:
      summary: Seek or continue a bounded continuous capture-date timeline
      operationId: seekPhotoTimeline
      description: Uses the same owner-private scope as dates. at navigates without filtering to that day. cursor
        must retain the identical scope. No source media is restored.
      parameters:
      - in: query
        name: at
        schema:
          type: string
          maxLength: 10
      - in: query
        name: rank
        schema:
          type: integer
          minimum: 0
      - in: query
        name: around
        schema:
          type: string
          maxLength: 128
      - in: query
        name: cursor
        schema:
          type: string
          maxLength: 8192
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
      - $ref: '#/components/parameters/PhotoScope_mode'
      - $ref: '#/components/parameters/PhotoScope_album'
      - $ref: '#/components/parameters/PhotoScope_date'
      - $ref: '#/components/parameters/PhotoScope_search'
      - $ref: '#/components/parameters/PhotoScope_q'
      - $ref: '#/components/parameters/PhotoScope_camera'
      - $ref: '#/components/parameters/PhotoScope_type'
      - $ref: '#/components/parameters/PhotoScope_from'
      - $ref: '#/components/parameters/PhotoScope_to'
      - $ref: '#/components/parameters/PhotoScope_outside_albums'
      - $ref: '#/components/parameters/PhotoScope_unknown'
      - $ref: '#/components/parameters/PhotoScope_hidden'
      responses:
        '200':
          description: Page, stable anchor, rank, scoped total and before/after cursors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoNavigationPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
  /api/v1/devices:
    get:
      summary: List owner devices
      operationId: getApiV1Devices
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters: []
    post:
      summary: Enroll a device
      operationId: postApiV1Devices
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  device:
                    $ref: '#/components/schemas/Device'
                  token:
                    type: string
                  scope:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: X-Weazl-Desk
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 120
              required:
              - name
      description: Account cookie and unlocked vault required; bearer credentials cannot enroll devices.
      security:
      - accountCookie: []
  /api/v1/devices/revoke:
    post:
      summary: Revoke an owner device
      operationId: postApiV1DevicesRevoke
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: X-Weazl-Desk
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  maxLength: 128
              required:
              - id
      description: A device bearer can revoke only itself.
  /api/v1/photos/capabilities:
    get:
      summary: Report implemented capabilities
      operationId: getApiV1PhotosCapabilities
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters: []
      description: While locked, roots is empty and vault_unlocked is false.
  /api/v1/photos:
    get:
      summary: Read a bounded timeline page
      operationId: getApiV1Photos
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: album
        in: query
        required: false
        schema:
          type: string
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - all
          - recent
          - favorites
          - archived
          - hidden
      - name: date
        in: query
        required: false
        schema:
          type: string
      - name: around
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
  /api/v1/photos/search:
    get:
      summary: Search metadata without reading originals
      operationId: getApiV1PhotosSearch
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 200
          default: 100
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: album
        in: query
        required: false
        schema:
          type: string
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - image
          - video
      - name: from
        in: query
        required: false
        schema:
          type: string
      - name: to
        in: query
        required: false
        schema:
          type: string
      - name: camera
        in: query
        required: false
        schema:
          type: string
      - name: outside_albums
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: favorite
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: hidden
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: archived
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: unknown
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
  /api/v1/photos/dates:
    get:
      summary: Read visible capture month counts
      operationId: getApiV1PhotosDates
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoNavigationDates'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - $ref: '#/components/parameters/PhotoScope_mode'
      - $ref: '#/components/parameters/PhotoScope_album'
      - $ref: '#/components/parameters/PhotoScope_date'
      - $ref: '#/components/parameters/PhotoScope_search'
      - $ref: '#/components/parameters/PhotoScope_q'
      - $ref: '#/components/parameters/PhotoScope_camera'
      - $ref: '#/components/parameters/PhotoScope_type'
      - $ref: '#/components/parameters/PhotoScope_from'
      - $ref: '#/components/parameters/PhotoScope_to'
      - $ref: '#/components/parameters/PhotoScope_outside_albums'
      - $ref: '#/components/parameters/PhotoScope_unknown'
      - $ref: '#/components/parameters/PhotoScope_hidden'
      - in: query
        name: month
        schema:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}$
  /api/v1/photos/assets/{id}:
    get:
      summary: Read one visible photo
      operationId: getApiV1PhotosAssetsId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoItem'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: hidden
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
    post:
      summary: Edit non-destructive photo metadata
      operationId: postApiV1PhotosAssetsId
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoItem'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: hidden
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: X-Weazl-Desk
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoEdit'
  /api/v1/photos/assets/{id}/thumbnail:
    get:
      summary: Read a bounded metadata-free derivative
      operationId: getApiV1PhotosAssetsIdThumbnail
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: hidden
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 96
          maximum: 1280
          default: 320
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
  /api/v1/photos/assets/{id}/original:
    get:
      summary: Read authorized original bytes
      operationId: getApiV1PhotosAssetsIdOriginal
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
        '206':
          description: Partial content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      parameters:
      - name: hidden
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: Range
        in: header
        required: false
        schema:
          type: string
      - name: If-Range
        in: header
        required: false
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      description: Supports a single byte range, HEAD, ETag and If-Range. Private no-store; lock cancels
        owner streams.
    head:
      summary: Read authorized original bytes
      operationId: headApiV1PhotosAssetsIdOriginal
      responses:
        '200':
          description: Success
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: hidden
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: Range
        in: header
        required: false
        schema:
          type: string
      - name: If-Range
        in: header
        required: false
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
          maxLength: 128
      description: Supports a single byte range, HEAD, ETag and If-Range. Private no-store; lock cancels
        owner streams.
  /api/v1/photos/albums:
    get:
      summary: List owner folder and custom albums
      operationId: getApiV1PhotosAlbums
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  albums:
                    type: array
                    items:
                      $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: hidden
        in: query
        required: false
        schema:
          type: string
          enum:
          - '0'
          - '1'
    post:
      summary: Edit a custom album or its memberships
      operationId: postApiV1PhotosAlbums
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Album'
                - type: object
                  properties:
                    status:
                      type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: X-Weazl-Desk
        in: header
        required: true
        schema:
          type: string
          enum:
          - '1'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumMutation'
      description: Deleting an album leaves originals intact. Revisions are optimistic. A selection_id
        may create initial memberships of a new custom album.
  /api/v1/photos/albums/memberships:
    get:
      summary: Read bounded custom album membership IDs
      operationId: getApiV1PhotosAlbumsMemberships
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumMembershipPage'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '507':
          $ref: '#/components/responses/Error507'
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
