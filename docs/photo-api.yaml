          anchor_id:
            type: string
          start:
            type: integer
            minimum: 0
          position:
            type: integer
            minimum: 0
          total:
            type: integer
            minimum: 0
    PhotoMetadataJob:
      type: object
      required:
      - status
      - total
      - examined
      - updated
      - unchanged
      - unresolved
      - failed
      - supported_embedded
