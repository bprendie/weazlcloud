          type: string
          format: date-time
      required:
      - id
      - name
      - created_at
      - expires_at
    SyncChange:
      type: object
      properties:
        sequence:
          type: integer
          format: int64
        kind:
          type: string
        id:
          type: string
          maxLength: 128
        deleted:
          type: boolean
        item:
          $ref: '#/components/schemas/PhotoItem'
        album:
          $ref: '#/components/schemas/Album'
        membership_changed:
          type: boolean
      required:
      - sequence
      - kind
      - id
    SyncPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PhotoItem'
          maxItems: 200
        albums:
          type: array
          items:
            $ref: '#/components/schemas/Album'
          maxItems: 200
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
          maxItems: 200
        next_cursor:
          type: string
        checkpoint:
          type: string
        has_more:
          type: boolean
        resync_required:
          type: boolean
      required:
      - items
      - has_more
      - resync_required
    Capabilities:
      type: object
      properties:
        version:
          type: integer
          format: int64
          enum:
          - 1
        vault_unlocked:
          type: boolean
        page_limit:
          type: integer
          format: int64
        chunk_limit:
          type: integer
          format: int64
        upload_components:
          type: array
          items:
            type: string
            enum:
            - original
            - motion
        roots:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                maxLength: 128
              name:
                type: string
              hidden:
                type: boolean
            required:
            - id
            - name
          maxItems: 200
        device_credentials:
          type: boolean
        durable_sync:
          type: boolean
        hidden_context:
          type: boolean
        album_edits:
          type: boolean
        gallery_grabs:
          type: boolean
        live_photo_uploads:
          type: boolean
        backup_direction:
          type: string
          enum:
          - device_to_vault
        locked_ingestion:
          type: string
          enum:
          - rejected
        checkpoint_expiry:
          type: string
      required:
      - version
      - vault_unlocked
      - roots
    GrabRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            maxLength: 128
          maxItems: 10000
        selection_id:
          type: string
          maxLength: 128
        hidden:
          type: boolean
        confirm_hidden:
          type: boolean
        title:
          type: string
          maxLength: 200
        gate:
          type: string
          enum:
          - open
          - passphrase
        passphrase:
          type: string
        expiry:
          type: string
          enum:
          - 24h
          - 3d
          - 7d
        grabs:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
      required:
      - gate
      - grabs
    Grab:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
        url:
          type: string
          format: uri
        kind:
          type: string
        name:
          type: string
        label:
          type: string
        gate:
          type: string
        limit:
          type: integer
          format: int64
        used:
          type: integer
          format: int64
        left:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - live
          - burned
        expires:
          type: string
          format: date-time
    GalleryItem:
      type: object
      properties:
        id:
          type: string
          pattern: ^[a-f0-9]{32}$
        name:
          type: string
        media_type:
          type: string
        preview_type:
          type: string
        size:
          type: integer
          format: int64
        revision:
          type: integer
          format: int64
      required:
      - id
      - name
      - media_type
      - size
      - revision
    GalleryManifest:
      type: object
      properties:
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/GalleryItem'
          maxItems: 10000
        original_metadata:
          type: boolean
      required:
      - title
      - items
      - original_metadata
    GalleryAuth:
      type: object
      properties:
        passphrase:
          type: string
        session:
          type: string
          maxLength: 2048
        ids:
          type: array
          items:
            type: string
            pattern: ^[a-f0-9]{32}$
          maxItems: 10000
    GalleryZIPJob:
      type: object
      properties:
        id:
          type: string
          maxLength: 128
        status:
          type: string
          enum:
          - queued
          - preparing
          - ready
          - failed
        bytes:
          type: integer
          format: int64
          minimum: 0
        error:
          type: string
      required:
      - id
      - status
      - bytes
  responses:
    Error400:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Authentication required or vault locked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Credential scope or origin denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Unknown or inaccessible item
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: Stale revision, cursor or identity conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error410:
      description: Expired upload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: Chunk or derivative too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Checksum mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error507:
      description: Insufficient node storage
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
