          - queued
          - running
          - paused
          - paused_error
          - complete
          - complete_with_issues
        total:
          type: integer
          minimum: 0
        examined:
          type: integer
          minimum: 0
        updated:
          type: integer
          minimum: 0
        unchanged:
          type: integer
          minimum: 0
        unresolved:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        initial_known:
          type: integer
          minimum: 0
        initial_unknown:
          type: integer
          minimum: 0
        supported_embedded:
