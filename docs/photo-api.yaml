components:
  securitySchemes:
    deviceBearer:
      type: http
      scheme: bearer
      description: Revocable Photos/device credential; no vault key. Cannot enroll devices.
    accountCookie:
      type: apiKey
      in: cookie
      name: weazl_session
  parameters:
    PhotoScope_mode:
      in: query
      name: mode
      schema:
        type: string
        enum:
        - all
        - favorites
        - archived
        - hidden
    PhotoScope_album:
      in: query
      name: album
      schema:
        type: string
        maxLength: 1024
    PhotoScope_date:
      in: query
      name: date
      schema:
        type: string
        maxLength: 10
    PhotoScope_search:
      in: query
      name: search
      schema:
        type: string
        enum:
        - '1'
    PhotoScope_q:
      in: query
      name: q
      schema:
        type: string
        maxLength: 256
    PhotoScope_camera:
      in: query
      name: camera
      schema:
        type: string
        maxLength: 120
    PhotoScope_type:
      in: query
      name: type
      schema:
        type: string
        enum:
        - image
        - video
    PhotoScope_from:
      in: query
      name: from
      schema:
        type: string
        format: date
    PhotoScope_to:
      in: query
      name: to
      schema:
        type: string
        format: date
    PhotoScope_outside_albums:
      in: query
      name: outside_albums
      schema:
        type: string
        enum:
        - '1'
    PhotoScope_unknown:
      in: query
      name: unknown
      schema:
        type: string
        enum:
        - '1'
    PhotoScope_hidden:
      in: query
      name: hidden
      schema:
        type: string
        enum:
        - '1'
  schemas:
    PhotoNavigationBucket:
      type: object
      required:
      - month
      - count
      - rank
      properties:
        month:
          type: string
        count:
          type: integer
          minimum: 0
        rank:
          type: integer
          minimum: 0
    PhotoNavigationDates:
      type: object
      required:
      - months
      - known_dates
      - unknown_dates
      - total
      - generation
      properties:
        months:
          type: array
          items:
            $ref: '#/components/schemas/PhotoNavigationBucket'
        days:
          type: array
          maxItems: 31
          items:
            $ref: '#/components/schemas/PhotoNavigationBucket'
        known_dates:
          type: integer
          minimum: 0
        unknown_dates:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        generation:
          type: integer
          minimum: 0
    PhotoNavigationPage:
      allOf:
      - $ref: '#/components/schemas/PhotoPage'
      - type: object
        required:
        - start
        - position
        - total
