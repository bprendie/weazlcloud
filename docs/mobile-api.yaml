components:
  securitySchemes:
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: 64 hexadecimal characters encoding 32 random bytes
    OwnerSession:
      type: apiKey
      in: cookie
      name: weazl_session
  schemas:
    PhotoContentKey:
      type: object
      additionalProperties: false
      required: [sha256, size]
      properties:
        sha256: {type: string, pattern: '^[0-9a-fA-F]{64}$'}
        size: {type: integer, format: int64, minimum: 1}
    PhotoContentLookupRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        include_hidden: {type: boolean, default: false}
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: {$ref: '#/components/schemas/PhotoContentKey'}
    PhotoContentLookupResponse:
      type: object
      required: [generation, results]
      properties:
        generation: {type: integer, format: int64, minimum: 0}
        results:
          type: array
          items:
            type: object
            required: [sha256, size, exists, matches, match_count, has_more_matches]
            properties:
              sha256: {type: string}
              size: {type: integer, format: int64}
              exists: {type: boolean}
              match_count: {type: integer, minimum: 0}
              has_more_matches: {type: boolean}
              matches:
                type: array
                maxItems: 20
                items:
                  type: object
                  required: [asset_id, revision, component_id, component_asset_id, hidden, archived]
                  properties:
                    asset_id: {type: string}
                    revision: {type: integer, format: int64}
                    component_id: {type: string, enum: [original, motion]}
                    component_asset_id: {type: string}
                    hidden: {type: boolean}
                    archived: {type: boolean}
    Error:
      type: object
      properties:
        error: {type: string}
        code: {type: string}
        retryable: *id006
        resync_required: *id006
        supported_contract_versions:
          type: array
          items: {type: integer, enum: [1]}
    Discovery:
