openapi: 3.1.0
info:
  title: WeazlCloud native mobile API
  version: 1-working-tree-2026-10-02
  description: Inspected local implementation, not a published release or full verification. x-required-scopes
    carries HTTP bearer resource scopes; security arrays are auth alternatives. paths contains implemented
    routes only. x-unimplemented-route-inventory records scope-only and pending patterns without generating
    unavailable client endpoints. Legacy DTO details remain in photo-api.md/yaml.
security:
- DeviceBearer: []
- OwnerSession: []
paths:
  /api/v1/photos/lookup:
    post:
      summary: Check owner Photos originals by SHA-256 and byte size before upload
      operationId: lookupPhotoContent
      x-required-scopes: [photos:read]
      description: Read-only catalog observation; no backup receipt or reservation. Hidden requires explicit inclusion. Live Photo components must match the same parent asset. See photo-content-lookup.md.
      parameters:
      - in: header
        name: X-Weazl-Desk
        required: true
        schema: {type: string, enum: ['1']}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoContentLookupRequest'
      responses:
        '200':
          description: Ordered results; at most 20 matches per item. Cache-Control is private, no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoContentLookupResponse'
        '400': {description: Invalid JSON, checksum, size, batch count or body over 64 KiB}
        '401': {description: Invalid credentials}
        '403': {description: Missing photos read scope or invalid request guard}
        '423': {description: Vault locked; owner unlock required}
  /api/v1/photos:
