      summary: PUT /api/v1/backups/uploads/{id}/components/{component}/parts/{index}
      operationId: put_api_v1_backups_uploads__id__components__component__parts__index_
      x-required-scopes:
      - backup:write
      - files:write
      x-legacy-photos-v1: false
      x-implementation-state: implemented
      security:
      - DeviceBearer: []
      - OwnerSession: []
      responses:
        '200':
          description: Accepted or matching repeat; transfer wrapper
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Invalid part/length
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Committed part conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Staging inactivity expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Checksum mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Vault locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '507':
          description: Storage admission failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - *id004
      - name: component
        in: path
        required: true
        schema: {type: string, enum: [original]}
      - name: index
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 0}
      - $ref: '#/components/parameters/MutationHeader'
      - name: Content-Length
        in: header
        required: true
        schema: {type: integer, format: int64, minimum: 1, maximum: 16777216}
        description: Exact computed part length; unknown/chunked length rejected.
      - name: X-Weazl-SHA256
        in: header
        required: true
        schema: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
      - $ref: '#/components/parameters/MobileContractHeader'
      - $ref: '#/components/parameters/MobileContractQuery'
      description: Independent zero-based part, 16 MiB except exact last remainder. Same accepted hash/length
        repeats idempotently. Part acceptance is not stored-original success. Device grant is checked
        before/after each body Read; vault session cancels streaming; native vault lock is 423.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
