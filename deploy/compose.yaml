services:
  weazlcloud:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: weazlcloud:local
    environment:
      WEAZLCLOUD_DATA: /data
      WEAZLCLOUD_DESK_ADDR: ":7272"
      WEAZLCLOUD_SHARE_ADDR: ":7273"
      WEAZLCLOUD_DRIVE_ADDR: ":7274"
      HOME: /data
      XDG_CACHE_HOME: /data/cache
      TMPDIR: /data/tmp
      WEAZLCLOUD_PREVIEW_WORKER_SOCKET: /run/weazlcloud-photo/worker.sock
    volumes:
      - weazlcloud-data:/data
      - weazlcloud-photo-ipc:/run/weazlcloud-photo
    depends_on:
      weazlcloud-photo-worker:
        condition: service_healthy
    expose:
      - "7272"
      - "7273"
      - "7274"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    user: "7272:7272"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/weazlcloud", "-ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  weazlcloud-photo-worker:
    image: weazlcloud:local
    entrypoint: ["/usr/local/bin/weazl-photo-worker"]
    environment:
      WEAZLCLOUD_PHOTO_WORKER_SOCKET: /run/weazlcloud-photo/worker.sock
      WEAZLCLOUD_PREVIEW_RENDERER: ${WEAZLCLOUD_PREVIEW_RENDERER:-auto}
    volumes:
      - weazlcloud-photo-ipc:/run/weazlcloud-photo
    cpus: ${WEAZLCLOUD_PHOTO_CPUS:-1.0}
    mem_limit: ${WEAZLCLOUD_PHOTO_MEMORY_LIMIT:-2g}
    pids_limit: 64
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # Override the image's VOLUME /data with empty, ephemeral worker storage.
      - /data:size=1m,mode=700,uid=7272,gid=7272
    user: "7272:7272"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/weazl-photo-worker", "-ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

# The household already has Traefik. Attach this service to that network
# instead of publishing host ports:
#
#   networks:
#     default:
#       name: traefik
#       external: true
#
# Hang three HTTPS names on 7272 (desk), 7273 (grab), 7274 (drive).
# Do not put unlock on the grab hostname.
#
# Local loopback peek while developing (not the product default):
#   ports:
#     - "127.0.0.1:7272:7272"

volumes:
  weazlcloud-data:
  weazlcloud-photo-ipc:
